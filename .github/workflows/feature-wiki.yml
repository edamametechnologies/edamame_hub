name: Update Features Wiki

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      domain_id:
        description: >-
          Hub domain UUID to capture (overrides the HUB_SCREENSHOT_DOMAIN_ID
          repository variable for this run; leave empty to use the variable).
        required: false
        default: ""
  schedule:
    # Weekly refresh so screenshots stay current even without pushes.
    - cron: "0 4 * * 1"

jobs:
  build-wiki:
    runs-on: ubuntu-latest

    steps:
      - name: Setup EDAMAME Posture
        uses: edamametechnologies/edamame_posture_action@v1
        with:
          edamame_user: ${{ vars.EDAMAME_POSTURE_USER }}
          edamame_domain: ${{ vars.EDAMAME_POSTURE_DOMAIN }}
          edamame_pin: ${{ secrets.EDAMAME_POSTURE_PIN }}
          edamame_id: ${{ github.run_id }}
          checkout: true
          wait_for_api: true
          wait_for_https: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Capture screenshots (features + workflows)
        # Non-blocking: if live capture fails (e.g. login/MFA), the wiki still
        # builds from any screenshots already committed to the repo.
        # The screenshots are taken on the "acme.com" demo workspace (Enterprise
        # plan, simulated fleet incl. AI-capable devices, so AI Governance is
        # populated). That reserved workspace is hidden from the post-login
        # landing page, so its UUID cannot be auto-detected: it comes from the
        # HUB_SCREENSHOT_DOMAIN_ID repository variable (every confirmed Hub
        # account is added to acme.com as a viewer, so the screenshot account
        # can open it). An empty value falls back to auto-detection.
        continue-on-error: true
        env:
          HUB_SCREENSHOT_EMAIL: ${{ secrets.HUB_SCREENSHOT_EMAIL }}
          HUB_SCREENSHOT_PASSWORD: ${{ secrets.HUB_SCREENSHOT_PASSWORD }}
          HUB_SCREENSHOT_DOMAIN_ID: ${{ github.event.inputs.domain_id || vars.HUB_SCREENSHOT_DOMAIN_ID }}
        run: python src/generate_screenshots.py --headless

      - name: Generate wiki markdown files
        run: |
          python src/build_feature_wiki.py \
            --screenshots-dir screenshots \
            --output-dir wiki

      - name: Clone wiki
        run: |
          mkdir -p /tmp/wiki/
          git clone https://${{ secrets.DEV_GITHUB_TOKEN }}@github.com/edamametechnologies/edamame_hub.wiki.git /tmp/wiki

      - name: Copy generated markdown files and images
        run: |
          cp wiki/*.md /tmp/wiki/
          mkdir -p /tmp/wiki/images
          cp -r wiki/images/* /tmp/wiki/images/ 2>/dev/null || true

      - name: Push to wiki
        run: |
          cd /tmp/wiki
          git config --global user.email "dev@edamame.tech"
          git config --global user.name "EDAMAME Dev"
          git add .
          if git commit -m "docs: Updated wiki files"; then
            echo "Changes committed, pushing to wiki..."
            git push
          else
            echo "No changes to commit to wiki."
            exit 0
          fi
